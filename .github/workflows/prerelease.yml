name: Prerelease (develop)

on:
  pull_request_target:
    branches: [ develop ]
    types: [ closed ]

permissions:
  contents: write

concurrency:
  group: prerelease-develop
  cancel-in-progress: false

jobs:
  prerelease:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Determine next prerelease version
        id: next_version
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            const stable = releases.find(
              (release) =>
                !release.draft &&
                !release.prerelease &&
                typeof release.tag_name === 'string' &&
                /^v(\d+)\.(\d+)\.(\d+)$/.test(release.tag_name)
            );

            let baseTag;
            if (!stable) {
              baseTag = 'v0.0.1';
            } else {
              const [, major, minor, patch] = stable.tag_name.match(/^v(\d+)\.(\d+)\.(\d+)$/);
              baseTag = `v${major}.${minor}.${Number(patch) + 1}`;
            }

            const baseVersion = baseTag.slice(1);

            const cp = require('child_process');
            const pattern = `v${baseVersion}-beta.*`;
            const tagsRaw = cp.execSync(`git tag -l "${pattern}"`).toString().trim();
            const tags = tagsRaw
              ? tagsRaw
                  .split('\n')
                  .map((value) => value.trim())
                  .filter(Boolean)
              : [];

            let maxN = 0;
            for (const tag of tags) {
              const match = tag.match(new RegExp(`^v${baseVersion}-beta\\.(\\d+)$`));
              if (match) {
                maxN = Math.max(maxN, Number(match[1]));
              }
            }

            const nextN = maxN + 1;
            const prereleaseTag = `v${baseVersion}-beta.${nextN}`;

            core.setOutput('base_tag', baseTag);
            core.setOutput('tag', prereleaseTag);
            core.setOutput('version', prereleaseTag.slice(1));

      - name: Update manifest version (prerelease)
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          p = Path('custom_components/appliance_cycle/manifest.json')
          data = json.loads(p.read_text())
          data['version'] = '${{ steps.next_version.outputs.version }}'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Commit & push manifest update to develop
        id: push_commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add custom_components/appliance_cycle/manifest.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git commit -m "chore: prerelease ${{ steps.next_version.outputs.version }}"

          git remote set-url origin \
            https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

          git push origin HEAD:${{ github.event.pull_request.base.ref }}

          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Create prerelease (auto notes)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.next_version.outputs.tag }}
          name: ${{ steps.next_version.outputs.tag }}
          target_commitish: ${{ steps.push_commit.outputs.sha }}
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
